# Quick test: keep PPO structure unchanged, but temporarily switch bw's
# own training target to an access-heavy variant (raw x_acc) to see whether
# bw leaves the near-uniform regime faster and develops clearer structure.

seed: 42
map_size: 1500.0
tau0: 1.0
T_steps: 250

num_uav: 3
num_gu: 20
num_sat: 144
walker_num_planes: 6
sat_state_max: 9

users_obs_max: 20
sats_obs_max: 6
visible_sats_max: 6
visible_sats_min: null
nbrs_obs_max: 4
danger_nbr_enabled: true

uav_height: 100.0
sat_height: 500000.0
theta_min_deg: 5.0
v_max: 30.0
a_max: 5.0
d_safe: 20.0
boundary_mode: reflect

candidate_mode: "nearest"
candidate_k: 20
assoc_unfair_gu_threshold: 15

uav_spawn_curriculum_enabled: false
uav_spawn_radius_start: 300.0
uav_spawn_radius_end: 900.0
uav_spawn_curriculum_steps: 100
uav_spawn_full_random_final: true
uav_safe_random_init_enabled: true
uav_init_boundary_margin_steps: 3.0
uav_init_speed_frac: 0.2
uav_init_min_spacing: 20.0

task_arrival_rate: 4.9e5
task_arrival_poisson: true
traffic_level: 2
traffic_level_nav_ratio: 0.08
traffic_level_easy_ratio: 0.5
traffic_level_hard_ratio: 1.0
arrival_ramp_steps: 0
arrival_ramp_start: 0.0
arrival_ramp_use_global: false
queue_max_gu_steps: 50.0
queue_max_uav_steps: 100.0
queue_max_sat_steps: 150.0
queue_max_gu: 2.45e7
queue_max_uav: 3.10e8
queue_max_sat: 4.75e8
queue_init_frac: 0.0
queue_init_uav_frac: 0.0
queue_init_sat_frac: 0.0
queue_init_gu_steps: 4.0
queue_init_uav_steps: 8.0
queue_init_sat_steps: 12.0
queue_ref_gu_per_step: 9.8e6
queue_ref_uav_per_step: 9.3e6
queue_ref_sat_per_step: 9.5e6
queue_ref_sat_active_count: 3.0

gu_tx_power: 0.18
uav_tx_power: 2.0
uav_tx_gain: 1.0e3
sat_rx_gain: 3.16227766e3
b_acc: 1.0e7
b_backhaul_per_sat: 1.5e7
sat_cpu_freq: 1.8e10
noise_density: 4.0e-21
carrier_freq: 3.0e10
subcarrier_spacing: 1.2e5
pathloss_mode: prob_los
pl_threshold_db: 140.0
atm_loss_enabled: true
atm_loss_db: 0.8
rain_loss_enabled: true
rain_rate_001_mmph: 25.0
rain_height_km: 5.0
rain_exceedance_pct: 0.5
rain_polarization_tilt_deg: 45.0
rain_lat_deg: 30.0

doppler_observed: true
doppler_atten_enabled: true
doppler_enabled: true
doppler_precomp_mode: residual_ppm
doppler_residual_ppm: 0.1
doppler_residual_ar_rho: 0.98
doppler_residual_sigma_hz: 100.0
nu_max: 4000.0
energy_enabled: false
fading_enabled: true
interference_enabled: true

enable_bw_action: true
fixed_satellite_strategy: false
sat_select_mode: sample
N_RF: 2
sat_candidate_mode: elevation
append_action_masks_to_obs: true
arrival_ref_mode: expected_arrival
sat_num_select: 2
structured_bw_objective_norm: per_latent_dim

avoidance_enabled: true
avoidance_eta: 3.5
avoidance_alert_factor: 2.0
avoidance_prealert_factor: 6.0
