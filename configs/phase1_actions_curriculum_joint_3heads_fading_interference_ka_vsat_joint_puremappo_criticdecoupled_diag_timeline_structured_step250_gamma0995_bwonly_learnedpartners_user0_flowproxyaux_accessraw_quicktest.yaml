train_accel: false
train_sat: false
train_bw: true
exec_accel_source: policy
exec_sat_source: policy
exec_bw_source: policy
structured_bw_loc_readout: user0
bw_flow_proxy_aux_enabled: true
bw_flow_proxy_aux_coef: 0.32
bw_flow_proxy_aux_delta: 0.05
