# Current-schema 3-UAV/20-GU BW PPO check.
# Environment recipe is the restored-load 3-cluster hotspot/interference regime:
# - T_steps=250, gamma=0.995.
# - GU clusters use std=80m and center_min_dist=700m.
# - UAVs use safe random initialization; accel execution still uses
#   cluster_center_queue_aware so they can move toward GU clusters during rollout.
# - Tune the fixed-satellite BW-only regime toward x_acc/x_rel/processed ~= 0.9.
#   Keep access bandwidth tidy at 3 MHz, raise offered load slightly, and give
#   the fixed selected SAT path a modest temporary downstream boost. For later
#   3-stage joint training, downstream capacity should be revisited/downscaled.
# - Current redesigned actor/critic config keys only; no legacy structured_bw_* fields.
seed: 42
map_size: 1500.0
tau0: 1.0
T_steps: 250
ref_lat_deg: 39.9042
ref_lon_deg: 116.4074

num_uav: 3
num_gu: 20
num_sat: 144
walker_num_planes: 6
sat_state_max: 9

users_obs_max: 20
sats_obs_max: 6
visible_sats_max: 6
visible_sats_min: null
nbrs_obs_max: 4
danger_nbr_enabled: false

uav_height: 100.0
sat_height: 500000.0
theta_min_deg: 5.0
v_max: 30.0
a_max: 5.0
d_safe: 20.0
boundary_mode: reflect

candidate_mode: assoc
candidate_k: 20
assoc_unfair_gu_threshold: 20

uav_spawn_mode: default
uav_spawn_curriculum_enabled: false
uav_safe_random_init_enabled: true
uav_init_speed_frac: 0.0

traffic_model: sticky_subset_hotspot
task_arrival_rate: 2.0e6
task_arrival_poisson: true
traffic_level: 2
traffic_level_nav_ratio: 0.08
traffic_level_easy_ratio: 0.5
traffic_level_hard_ratio: 1.0
arrival_ramp_steps: 0
arrival_ramp_start: 0.0
arrival_ramp_use_global: false
arrival_base_hetero: 0.0
gu_init_num_clusters: 3
gu_init_cluster_std: 80.0
gu_init_cluster_center_min_dist: 700.0
hotspot_num_subsets: 20
hotspot_subset_size: 10
hotspot_rho: 20.0
hotspot_on_mean_steps: 20.0
hotspot_off_mean_steps: 1.0
arrival_mean_preserve: true

queue_max_gu_steps: 24.0
queue_max_uav_steps: 60.0
queue_max_sat_steps: 60.0
queue_ref_gu_per_step: 4.00e7
queue_ref_uav_per_step: 4.00e7
queue_ref_sat_per_step: 4.00e7
queue_ref_sat_active_count: 3.0
queue_init_frac: 0.0
queue_init_uav_frac: 0.0
queue_init_sat_frac: 0.0
queue_init_gu_steps: 0.0
queue_init_uav_steps: 0.0
queue_init_sat_steps: 0.0

gu_tx_power: 0.18
uav_tx_power: 2.0
uav_tx_gain: 1.0e3
sat_rx_gain: 3.16227766e3
