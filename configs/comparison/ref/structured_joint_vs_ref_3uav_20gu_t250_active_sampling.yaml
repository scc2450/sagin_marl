b_acc: 2.0e6
b_backhaul_per_sat: 1.0e7
sat_cpu_freq: 5.0e10
noise_density: 4.0e-21
carrier_freq: 3.0e10
access_carrier_freq: 2.0e9
backhaul_carrier_freq: 3.0e10
access_noise_figure_db: 5.0
backhaul_noise_figure_db: 3.0
subcarrier_spacing: 1.2e5
pathloss_mode: prob_los
